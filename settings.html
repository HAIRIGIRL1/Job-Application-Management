
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | JAMS</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body data-page="settings">
    <div id="appShell"></div>

    <main class="main">
        <header class="topbar">
            <div>
                <span class="eyebrow">WORKSPACE</span>
                <h1>Settings</h1>
            </div>

            <div class="top-actions">
                <a class="icon-btn" href="notifications.html">♧</a>
                <div class="avatar">AD</div>
                <b>Admin</b>
            </div>
        </header>

        <section class="page-intro">
            <div>
                <h2>System Settings</h2>
                <p class="muted">
                    Manage administrator information and application preferences.
                </p>
            </div>
        </section>

        <form id="settingsForm" class="panel">
            <h2>Administrator Information</h2>
            <p class="muted">Update your system information below.</p>

            <div class="form-grid">
                <div class="form-group">
                    <label for="adminName">Administrator Name</label>
                    <input
                        type="text"
                        id="adminName"
                        name="adminName"
                        placeholder="Enter administrator name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="adminEmail">Administrator Email</label>
                    <input
                        type="email"
                        id="adminEmail"
                        name="adminEmail"
                        placeholder="admin@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="companyName">Company Name</label>
                    <input
                        type="text"
                        id="companyName"
                        name="companyName"
                        placeholder="Enter company name"
                    >
                </div>

                <div class="form-group">
                    <label for="defaultStatus">Default Applicant Status</label>
                    <select id="defaultStatus" name="defaultStatus">
                        <option value="Applied">Applied</option>
                        <option value="Pending">Pending</option>
                        <option value="Under Review">Under Review</option>
                        <option value="Interview">Interview</option>
                    </select>
                </div>
            </div>

            <p id="settingsMessage" class="form-message" role="status"></p>

            <div class="form-actions">
                <button type="submit" class="btn primary">
                    Save Settings
                </button>

                <a href="admin.html" class="btn secondary">
                    Back to Dashboard
                </a>
            </div>
        </form>

        <section class="panel">
            <h2>Demo Data</h2>
            <p class="muted">
                Restore the original sample records and system settings.
            </p>

            <button type="button" id="resetDemo" class="btn danger">
                Reset Demo Data
            </button>
        </section>
    </main>

    <script src="storage.js"></script>
    <script src="sidebar.js"></script>
    <script src="validation.js"></script>
    <script src="script.js"></script>
</body>
</html>
