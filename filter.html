<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Applicants | JAMS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="filter">
    <div id="appShell"></div>

    <main class="main">
        <header class="topbar">
            <div>
                <span class="eyebrow">RECRUITMENT TOOLS</span>
                <h1>Filter Applicants</h1>
            </div>
            <div class="top-actions">
                <div class="avatar">AD</div>
                <b>Admin</b>
            </div>
        </header>

        <section class="panel form-panel">
            <div class="panel-head">
                <div>
                    <h2>Find qualified applicants</h2>
                    <p class="muted">Combine filters to narrow the applicant list.</p>
                </div>
            </div>

            <form id="filterForm">
                <div class="form-grid">
                    <div>
                        <label for="filterPosition">Application position</label>
                        <select id="filterPosition">
                            <option value="">All positions</option>
                            <option>Web Developer</option>
                            <option>Software Developer</option>
                            <option>IT Support Specialist</option>
                            <option>UI/UX Designer</option>
                            <option>Data Analyst</option>
                            <option>HR Assistant</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div>
                        <label for="filterStatus">Application status</label>
                        <select id="filterStatus">
                            <option value="">All statuses</option>
                            <option>Applied</option>
                            <option>Under Review</option>
                            <option>Interview</option>
                            <option>Hired</option>
                            <option>Rejected</option>
                        </select>
                    </div>

                    <div class="span-2">
                        <label for="filterQualification">Qualification keyword</label>
                        <input
                            id="filterQualification"
                            placeholder="Education, skill, or experience (e.g. JavaScript)"
                        >
                    </div>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn secondary">Clear filters</button>
                    <button type="submit" class="btn primary">Apply filters</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-head">
                <div>
                    <h2>Matching applicants</h2>
                    <p id="filterSummary" class="muted">Apply filters to see matching records.</p>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Applicant</th>
                            <th>Education</th>
                            <th>Skills</th>
                            <th>Position</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="filterRows"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="storage.js"></script>
    <script src="sidebar.js"></script>
    <script src="validation.js"></script>
    <script src="script.js"></script>
</body>
</html>
